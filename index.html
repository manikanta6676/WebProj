<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dark Landing</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav>
        <div class="logo">Aura</div>
        <ul class="nav-links">
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="hero">
        <h1>Is Vivek in LOVE with Phani</h1>
        <p>Answer below.</p>
        <div class="button-container">
          <button type="button">YES</button>
          <button type="button">NO</button>
        </div>
       
      </section>
    </main>
  </body>
</html>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Inter", sans-serif;
  }

  body {
    background-color: #0f1115;
    color: #f1f1f1;
  }

  header {
    padding: 2rem 5%;
  }

  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .logo {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 2px;
    color: #7b61ff;
  }

  .nav-links {
    list-style: none;
    display: flex;
    gap: 2rem;
  }

  .nav-links a {
    color: #a0a4b8;
    text-decoration: none;
    font-size: 0.9rem;
    transition: color 0.3s;
  }

  .nav-links a:hover {
    color: #ffffff;
  }

  .hero {
    height: 80vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 0 1rem;
  }

  .hero h1 {
    font-size: 4rem;
    font-weight: 800;
    margin-bottom: 1rem;
    background: linear-gradient(to right, #ffffff, #7b61ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .hero p {
    font-size: 1.2rem;
    color: #a0a4b8;
    margin-bottom: 2.5rem;
  }

  .cta-btn {
    padding: 1rem 2.5rem;
    font-size: 1rem;
    font-weight: 600;
    background-color: #7b61ff;
    color: #ffffff;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    transition:
      background-color 0.3s,
      transform 0.2s;
  }
  .button-container {
    display: flex;       /* Aligns children in a row */
    gap: 10px;           /* Adds a 10px space between the buttons */
  }

  .cta-btn:hover {
    background-color: #6248df;
    transform: translateY(-2px);
  }
</style>
